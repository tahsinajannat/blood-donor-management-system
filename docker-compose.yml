# Runs PostgreSQL, the database migrations and the FastAPI backend.
#
#   docker compose up --build
#
# API:      http://localhost:8000  (docs at /docs)
# Postgres is only reachable inside Docker. To connect from your machine
# (psql, pgAdmin), uncomment the "ports" lines under "db".
#
# Override any value with a .env file next to this file.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-blood_donation_db}
    # ports:
    #   - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    image: blood-donor-backend
    command: ["python", "-m", "src.db.script.migrate"]
    environment: &backend-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-blood_donation_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: blood-donor-backend
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
