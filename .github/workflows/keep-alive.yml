# Pings the backend so Render's free plan doesn't put it to sleep
# (it sleeps after ~15 minutes without traffic).
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions
#        -> Variables -> New repository variable
#        Name:  BACKEND_URL
#        Value: https://your-app.onrender.com   (no trailing slash)

name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes (GitHub may delay runs a little)
  workflow_dispatch:         # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --max-time 90 \
            "${{ vars.BACKEND_URL }}/health"
